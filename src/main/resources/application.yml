spring:
  application:
    name: gerenciador-pilates
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gerenciadorpilates}
    username: ${POSTGRES_USER:pilates}
    password: ${POSTGRES_PASSWORD:pilates}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

app:
  name: Gerenciador Pilates
  timezone: America/Fortaleza
  security:
    jwt:
      secret: ${JWT_SECRET:gerenciador-pilates-local-secret-key-2026-secure}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: local

  docker:
    compose:
      enabled: false

logging:
  level:
    org.hibernate.SQL: info

app:
  bootstrap-admin:
    enabled: true
    full-name: Administrador Local
    email: admin@gerenciadorpilates.local
    password: Admin@12345

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:gerenciadorpilates;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  bootstrap-admin:
    enabled: true
    full-name: Administrador Teste
    email: admin@test.local
    password: Admin@12345

---
spring:
  config:
    activate:
      on-profile: prod

management:
  endpoint:
    health:
      show-details: never
